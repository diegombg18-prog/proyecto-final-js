<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Comercial - Tienda de Café</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light">

    <header class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">☕ Café Store - Simulador</span>
            <button class="btn btn-outline-light position-relative" id="btnVerCarrito">
                Carrito <span id="contadorCarrito" class="badge bg-danger">0</span>
            </button>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="mb-4">Catálogo de Productos</h1>
        <!-- Contenedor donde se renderizarán dinámicamente los productos -->
        <div class="row" id="contenedorProductos"></div>

        <section class="mt-5" id="seccionCarrito">
            <h2>Tu Carrito de Compras</h2>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCarrito">
                        <!-- Items del carrito renderizados por JS -->
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <h4>Total: $<span id="montoTotal">0</span></h4>
                <div>
                    <button class="btn btn-outline-danger me-2" id="btnVaciarCarrito">Vaciar Carrito</button>
                    <button class="btn btn-success" id="btnConfirmarCompra">Confirmar Compra</button>
                </div>
            </div>
        </section>
    </main>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Archivos JS propios en orden de dependencia -->
    <script src="./js/storage.js" defer></script>
    <script src="./js/ui.js" defer></script>
    <script src="./js/main.js" defer></script>
</body>
</html>
